name: Daily joy update

on:
  schedule:
    # BACKUP trigger only. The primary, punctual trigger is a Cloudflare Worker
    # cron (gethappy-services/daily-trigger) that fires at 12:00 UTC and dispatches
    # this workflow. GitHub's own scheduler is unreliable — it delays runs hours or
    # drops them entirely — so it runs LATER (14:00 UTC) purely as a safety net. If
    # the Worker already updated today's postcard, update_joy.py's idempotency guard
    # makes this backup run a clean no-op.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's postcard even if it's already current (passes --force)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-joy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh joy.json
        env:
          # Postcard writer + grounding via free Cloudflare Workers AI (Kimi writer,
          # Mistral reviewer) over stdlib urllib. Optional: missing token OR account
          # id → degrade path (reuse/fallback); Actions stay green. Set both secrets
          # for the writer path. Token already present; add CLOUDFLARE_ACCOUNT_ID.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/update_joy.py ${{ inputs.force && '--force' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "gethappyinfo-bot"
          git config user.email "bot@gethappyinfo.com"
          # Always-present files (postcard + recent history)
          CORE_PATHS="public/joy.json public/joy-archive.json data/recent.json"
          # V3 content-library outputs (optional; only exist if generation runs)
          OPTIONAL_PATHS="public/index.json public/sitemap.xml public/llms.txt public/robots.txt \
                          public/today-pages.json data/kindness-slugs.json data/generation-log.json \
                          public/story public/kindness"
          if [[ -n "$(git status --porcelain $CORE_PATHS)" ]]; then
            git add $CORE_PATHS
            # Add optional files only if they exist
            for path in $OPTIONAL_PATHS; do
              [[ -e "$path" ]] && git add "$path" || true
            done
            git commit -m "Daily joy update ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
