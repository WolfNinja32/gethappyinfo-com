name: Daily joy update

on:
  schedule:
    # BACKUP trigger only. The primary, punctual trigger is a Cloudflare Worker
    # cron (gethappy-services/daily-trigger) that fires at 12:00 UTC and dispatches
    # this workflow. GitHub's own scheduler is unreliable — it delays runs hours or
    # drops them entirely — so it runs LATER (14:00 UTC) purely as a safety net. If
    # the Worker already updated today's postcard, update_joy.py's idempotency guard
    # makes this backup run a clean no-op.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-joy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh joy.json
        env:
          # Story-page summaries (Claude Haiku via stdlib urllib). Optional: with no
          # key the run is skip-only — the daily postcard never depends on it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_joy.py

      - name: Commit if changed
        run: |
          git config user.name "gethappyinfo-bot"
          git config user.email "bot@gethappyinfo.com"
          # Postcard payload + V3 content-library outputs (story/kindness pages,
          # cumulative sitemap/index/llms, slug ledger, skip-audit log).
          PATHS="public/joy.json public/joy-archive.json public/index.json \
                 public/sitemap.xml public/llms.txt public/robots.txt \
                 public/today-pages.json data/recent.json data/kindness-slugs.json data/generation-log.json"
          if [[ -n "$(git status --porcelain $PATHS)" ]]; then
            git add $PATHS
            # Optional directories (only exist if content was generated)
            [[ -d public/story ]] && git add public/story || true
            [[ -d public/kindness ]] && git add public/kindness || true
            git commit -m "Daily joy update ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
