name: Daily joy update

on:
  schedule:
    # 12:00 UTC = 05:00 PDT (Mar–Nov) / 04:00 PST (Nov–Mar). GitHub Actions cron
    # is UTC-only, so 5 AM Pacific can only be exact for one DST half — picked
    # the PDT half since it's ~8 months/year. GitHub may delay scheduled runs
    # 10–30 min under load; exact minute doesn't matter for a daily site.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-joy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh joy.json
        run: python scripts/update_joy.py

      - name: Commit if changed
        run: |
          git config user.name "gethappyinfo-bot"
          git config user.email "bot@gethappyinfo.com"
          if [[ -n "$(git status --porcelain public/joy.json public/joy-archive.json data/recent.json)" ]]; then
            git add public/joy.json public/joy-archive.json data/recent.json
            git commit -m "Daily joy update ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
