<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Get Happy Info — a daily dose of good</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="One small act of kindness and a few pieces of good news, refreshed every day. Spread happiness and joy." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%98%80%EF%B8%8F</text></svg>" />
  <style>
    :root { --accent: #ffcc00; --ink: #33312b; --muted: #8a857a; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 1.5rem;
      background: linear-gradient(135deg, #fff9e3 0%, #ffffff 100%);
      color: var(--ink); line-height: 1.5;
    }
    main { max-width: 520px; width: 100%; text-align: center; }
    h1 {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muted); font-weight: 600; margin: 2rem 0 0.75rem;
    }
    .micro-joy {
      background: #fff; padding: 1.75rem 1.5rem; border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06); border: 2px solid var(--accent);
    }
    .micro-joy p { font-size: 1.45rem; font-weight: 600; margin: 0; }
    ul.news { list-style: none; padding: 0; margin: 0.5rem 0 0; text-align: left; }
    ul.news li {
      padding: 0.85rem 0; border-bottom: 1px solid #f0ead6;
      font-size: 1.05rem; color: #4a463d;
    }
    ul.news li:last-child { border-bottom: 0; }
    ul.news a {
      color: inherit; text-decoration: none; display: inline-flex;
      gap: 0.4rem; align-items: baseline;
    }
    ul.news a:hover { text-decoration: underline; }
    ul.news .arrow { color: var(--muted); font-size: 0.9rem; }
    .empty { color: var(--muted); font-style: italic; padding: 0.85rem 0; }
    footer { margin: 2.5rem 0 0.5rem; font-size: 0.78rem; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Today's Micro-Joy</h1>
    <div class="micro-joy"><p id="task">Loading a little joy…</p></div>

    <h1>Why the world is good today</h1>
    <ul class="news" id="news"></ul>

    <footer>
      <span id="updated">gethappyinfo.com</span> — a daily dose of good, updated automatically.
    </footer>
  </main>

  <script>
    (async function () {
      const taskEl = document.getElementById("task");
      const newsEl = document.getElementById("news");
      const updatedEl = document.getElementById("updated");
      const fallbackTask = "Do one small, kind thing for someone today.";
      try {
        const res = await fetch("/joy.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("status " + res.status);
        const data = await res.json();

        taskEl.textContent = data.dailyTask || fallbackTask;

        const news = Array.isArray(data.topNews) ? data.topNews : [];
        if (news.length === 0) {
          newsEl.innerHTML = '<li class="empty">More good news on the way — check back soon.</li>';
        } else {
          newsEl.innerHTML = news.map(function (n) {
            const url = encodeURI(n.url || "#");
            const text = (n.text || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return '<li><a href="' + url + '" target="_blank" rel="noopener noreferrer">'
              + text + ' <span class="arrow">↗</span></a></li>';
          }).join("");
        }

        if (data.lastUpdated) {
          updatedEl.textContent = "gethappyinfo.com — updated " + data.lastUpdated;
        }
      } catch (err) {
        // Degrade gracefully: never a blank screen.
        taskEl.textContent = fallbackTask;
        newsEl.innerHTML = '<li class="empty">More good news on the way — check back soon.</li>';
      }
    })();
  </script>
</body>
</html>
